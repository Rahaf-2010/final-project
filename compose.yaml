services:
  backend:
    build:
      context: ./backend
    container_name: issa-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://host.docker.internal:27017/issa_automobile
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
    container_name: issa-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend